<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#8A6A20"/>
      <stop offset="50%"  stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#D4AA6A"/>
    </linearGradient>
  </defs>

  <!-- Gold border ring -->
  <circle cx="50" cy="50" r="49" fill="url(#g)"/>
  <!-- Black fill -->
  <circle cx="50" cy="50" r="44" fill="#111111"/>

  <!-- RM in italic serif with gold gradient -->
  <text
    x="50" y="47"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-size="32"
    font-weight="400"
    fill="url(#g)"
  >RM</text>

  <!-- Divider line -->
  <line x1="26" y1="60" x2="74" y2="60" stroke="url(#g)" stroke-width="0.7"/>

  <!-- MODAS in small spaced sans-serif -->
  <text
    x="50" y="73"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="8"
    font-weight="300"
    letter-spacing="3.5"
    fill="#C9A84C"
  >MODAS</text>
</svg>
